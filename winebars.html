<body>
  <header class="site-header">
    <a class="brand" href="index.html">Wine Pantry</a>

    </nav>

  <main>
    <h1>Wine Bars</h1>
    <p class="page-intro">Wine bars visited.</p>
    <div class="map-panel" id="winebars-map"></div>
    <div class="card-grid" id="winebars-list"></div>
  </main>

  <footer class="site-footer">Wine Pantry (a personal project)</footer>
  <script src="js/main.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function googleMapsUrl(item) {
      const query = encodeURIComponent(item.location ? `${item.name}, ${item.location}` : item.name);
      return `https://www.google.com/maps/search/?api=1&query=${query}`;
    }

    function winebarTemplate(item) {
      return `
        <article class="card">
          ${item.image ? `<img src="${item.image}" alt="${item.name}">` : ""}
          <h3>${item.name}</h3>
          <p class="card-meta">${item.location || ""}</p>
          ${item.dateVisited ? `<p class="card-meta">Visited: ${item.dateVisited}</p>` : ""}
          ${item.rating ? `<p class="card-meta">Rating: ${item.rating}</p>` : ""}
          ${item.notes ? `<p>${item.notes}</p>` : ""}
          <p class="card-meta"><a href="${googleMapsUrl(item)}" target="_blank" rel="noopener">Open in Google Maps</a></p>
        </article>
      `;
    }

    function renderMap(winebars) {
      const mapEl = document.getElementById("winebars-map");
      const pinned = winebars.filter((w) => typeof w.lat === "number" && typeof w.lng === "number");

      if (!pinned.length) {
        mapEl.outerHTML = '<p class="empty-state">No wine bars pinned yet.</p>';
        return;
      }

      const map = L.map(mapEl);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>',
        maxZoom: 19
      }).addTo(map);

      pinned.forEach((w) => {
        L.marker([w.lat, w.lng]).addTo(map).bindPopup(
          `<strong>${w.name}</strong><br>${w.location || ""}<br><a href="${googleMapsUrl(w)}" target="_blank" rel="noopener">Open in Google Maps</a>`
        );
      });

      if (pinned.length === 1) {
        map.setView([pinned[0].lat, pinned[0].lng], 15);
      } else {
        map.fitBounds(L.latLngBounds(pinned.map((w) => [w.lat, w.lng])), { padding: [30, 30] });
      }
    }

    fetch("data/winebars.json")
      .then((res) => res.json())
      .then((winebars) => {
        renderMap(winebars);

        const list = document.getElementById("winebars-list");
        list.innerHTML = winebars.length
          ? winebars.map(winebarTemplate).join("")
          : '<p class="empty-state">Nothing here yet.</p>';
      })
      .catch((err) => {
        console.error("Failed to load data/winebars.json", err);
        document.getElementById("winebars-list").innerHTML =
          '<p class="empty-state">Could not load data. If you\'re viewing this via file://, try running a local server (e.g. <code>python3 -m http.server</code>) instead.</p>';
      });
  </script>
</body>
</html>
