  <script src="js/main.js"></script>
  <script>
    loadAndRender("data/regions.json", "regions-list", (item) => `
      <article class="card">
        ${item.image ? `<img src="${item.image}" alt="${item.name}">` : ""}
        <h3>${item.name}</h3>
        <p class="card-meta">${item.country || ""}</p>
        ${item.link ? `<p class="card-meta"><a href="${item.link}" target="_blank" rel="noopener">Learn more</a></p>` : ""}
        ${item.why ? `<p>${item.why}</p>` : ""}
      </article>
    `);
  </script>
