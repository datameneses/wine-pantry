  <main>
    <h1>Boards</h1>
    <p class="page-intro">Charcuterie board combinations and the wines that pair well with them.</p>

  </main>

  <footer class="site-footer">Wine Pantry (a personal project)</footer>
  <script src="js/main.js"></script>
  <script>
    function renderSteps(steps) {
      if (!steps || !steps.length) return "";
      const items = steps
        .map((s, i) => {
          const label = s.label.charAt(0).toUpperCase() + s.label.slice(1);
          return `<div class="step"><strong>${i + 1}. ${label}:</strong> ${s.detail}</div>`;
        })
        .join("");
      return `<div class="step-list">${items}</div>`;
    }

    function renderSubList(title, items) {
      if (!items || !items.length) return "";
      const rows = items.map((i) => `<li>${i}</li>`).join("");
      return `<p class="sub-heading">${title}</p><ul class="tip-list">${rows}</ul>`;
    }

    function renderComponents(components) {
      if (!components || !components.length) return "";
      return components.map((group) => renderSubList(group.category, group.items)).join("");
    }

    function renderPairing(pairing) {
      if (!pairing) return "";
      const wineLabel = pairing.wine ? `<strong>${pairing.wine}</strong>` : "";
      const notes = pairing.notes || "";
      return `<div class="pairing-note">${wineLabel}${wineLabel && notes ? " — " : ""}${notes}</div>`;
    }

    function boardTemplate(item) {
      return `
        <article class="card recipe-card">
          <div class="recipe-title-row">
            ${item.icon ? `<img class="recipe-icon" src="${item.icon}" alt="">` : ""}
            <h3>${item.name}</h3>
          </div>
          ${item.serves ? `<p class="card-meta">${item.serves}</p>` : ""}
          ${renderComponents(item.components)}
          ${renderSteps(item.steps)}
          ${renderSubList("Tips", item.tips)}
          ${item.pairing ? `<p class="sub-heading">Wine pairing</p>${renderPairing(item.pairing)}` : ""}
        </article>
      `;
    }

    loadAndRender("data/boards.json", "boards-list", boardTemplate);
  </script>
</body>
